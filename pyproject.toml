[project]
name = "campaign-copilot"
version = "0.1.0"
description = "Multi-agent campaign planning for a fictional community bank (Northwind). LangGraph + MCP + FastAPI."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "anthropic>=1.0,<2",
    "mcp>=2.0,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["campaign_copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
